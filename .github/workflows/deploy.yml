name: Deploy

# Publica o Hosting depois do CI verde: push em develop → dv, em main → produção.
# Secrets criados pelo `npx firebase init hosting:github` (-P dev e -P prod), o mesmo
# padrão dos outros projetos fed-catalogo-*. Functions e regras seguem por deploy manual.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      PRODUCAO: ${{ github.event.workflow_run.head_branch == 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build (produção em main, dv em develop)
        run: npm run build -- --configuration=${{ env.PRODUCAO == 'true' && 'production' || 'dv' }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.PRODUCAO == 'true' && secrets.FIREBASE_SERVICE_ACCOUNT_FED_CATALOGO_COMPARA_PRECOS || secrets.FIREBASE_SERVICE_ACCOUNT_FED_CATALOGO_COMPARA_PRECOS_DV }}
          channelId: live
          projectId: ${{ env.PRODUCAO == 'true' && 'fed-catalogo-compara-precos' || 'fed-catalogo-compara-precos-dv' }}
