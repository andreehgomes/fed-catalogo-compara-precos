name: Deploy

# Depois do CI verde: push em develop → dv, em main → produção.
# Publica Hosting, Functions, regras e índices do Firestore com a conta
# github-action-<id do repo> (secret FIREBASE_SERVICE_ACCOUNT_FED_CATALOGO_COMPARA_PRECOS(_DV)),
# que além dos papéis do `firebase init hosting:github` precisa de firebase.admin,
# cloudfunctions.admin, run.admin, cloudscheduler.admin, artifactregistry.admin,
# secretmanager.admin (secret ANTHROPIC_API_KEY) e iam.serviceAccountUser.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      PRODUCAO: ${{ github.event.workflow_run.head_branch == 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - run: npm ci

      - working-directory: functions
        run: npm ci

      - name: Build (produção em main, dv em develop)
        run: npm run build -- --configuration=${{ env.PRODUCAO == 'true' && 'production' || 'dv' }}

      - name: Credencial da conta de deploy
        env:
          CONTA: ${{ env.PRODUCAO == 'true' && secrets.FIREBASE_SERVICE_ACCOUNT_FED_CATALOGO_COMPARA_PRECOS || secrets.FIREBASE_SERVICE_ACCOUNT_FED_CATALOGO_COMPARA_PRECOS_DV }}
        run: |
          printf '%s' "$CONTA" > "$RUNNER_TEMP/conta.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/conta.json" >> "$GITHUB_ENV"

      - name: firebase deploy
        run: >
          npx firebase deploy
          --only hosting,functions,firestore:rules,firestore:indexes
          -P ${{ env.PRODUCAO == 'true' && 'prod' || 'dev' }}
          --non-interactive --force
