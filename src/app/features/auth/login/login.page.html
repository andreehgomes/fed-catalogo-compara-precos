<main class="cp-auth">
  <div class="cp-auth-inner">
    <div class="cp-auth-brand">
      <span class="cp-auth-logo"><mat-icon aria-hidden="true">shopping_basket</mat-icon></span>
      <div>
        <strong>Compara Preços</strong>
        <span>Suas notas e os preços do Paraná</span>
      </div>
    </div>

    <form class="cp-auth-card" [formRoot]="form">
      <div>
        <h1>Entrar</h1>
        <p>Use o e-mail e a senha da sua conta.</p>
      </div>

      <label class="cp-field">
        <span>E-mail</span>
        <input
          type="email"
          autocomplete="email"
          inputmode="email"
          [formField]="form.email"
          [attr.aria-invalid]="!!erroEmail()"
          [attr.aria-describedby]="erroEmail() ? 'login-email-erro' : null"
        />
      </label>
      @if (erroEmail(); as msg) {
        <span id="login-email-erro" class="cp-field-error">{{ msg }}</span>
      }

      <label class="cp-field">
        <span>Senha</span>
        <input
          type="password"
          autocomplete="current-password"
          [formField]="form.senha"
          [attr.aria-invalid]="!!erroSenha()"
          [attr.aria-describedby]="erroSenha() ? 'login-senha-erro' : null"
        />
      </label>
      @if (erroSenha(); as msg) {
        <span id="login-senha-erro" class="cp-field-error">{{ msg }}</span>
      }

      @if (erro(); as msg) {
        <div class="cp-info-block cp-info-block--erro" role="alert">
          <mat-icon aria-hidden="true">error</mat-icon>{{ msg }}
        </div>
      }

      <button class="cp-btn-primary" type="submit" [disabled]="enviando()">
        {{ enviando() ? 'Entrando…' : 'Entrar' }}
      </button>

      <div class="cp-auth-divisor"><span>ou</span></div>
      <cp-botao-google [destino]="destino()" />

      <div class="cp-auth-links">
        <a routerLink="/redefinir-senha">Esqueci a senha</a>
        <a routerLink="/cadastro">Criar conta</a>
      </div>
    </form>
  </div>
</main>
